# Potongan untuk ~/.hermes/config.yaml
# Salin bagian yang dibutuhkan ke config Hermes kamu, lalu ganti nilai <...>.
# JANGAN commit API key asli ke repo.

# Skill tim: arahkan ke folder hermes/skills di clone repo ini.
skills:
  external_dirs:
    - <path-ke-clone>/csirt-skill-hermes/hermes/skills

mcp_servers:
  # WOLFSTRIKE: MCP server repo ini. Jalankan dulu `npm run dev` di root repo.
  # Ganti URL kalau server jalan di host atau port lain.
  wolfstrike:
    url: "http://localhost:3000/mcp"

  # Koneksi ke TheHive 5 lewat thehive-mcp (https://github.com/solomonneas/thehive-mcp)
  thehive:
    command: "npx"
    args: ["-y", "thehive-mcp"]
    env:
      THEHIVE_URL: "<https://alamat-thehive:9000>"
      THEHIVE_API_KEY: "<api-key-thehive>"
      # Tool yang mengubah data (create/update/close/delete, run analyzer) tetap mati.
      # Ubah ke "true" hanya kalau tim sudah sepakat Hermes boleh menulis ke TheHive.
      THEHIVE_ALLOW_DESTRUCTIVE_TOOLS: "false"
      # Set "false" hanya untuk lab dengan sertifikat self-signed.
  


